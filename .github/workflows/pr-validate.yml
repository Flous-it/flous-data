name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate YAML schemas + cross-references
        run: python scripts/validate.py

      - name: Lint
        run: ruff check schemas/ scripts/

      - name: Type check
        run: mypy schemas/ scripts/
