name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/pr-validate.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build artifacts
        run: python scripts/build.py

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flous-data-dist
          path: dist/
          retention-days: 7

  # Publish the built dataset to the CDN (Cloudflare R2). This is the ONLY
  # distribution channel — there are no PyPI/npm packages. Consumers such as
  # flous-api pull the data from the CDN; flous-web never reads the CDN directly.
  publish-cdn:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      FLOUS_WEBHOOK_URL: ${{ secrets.FLOUS_WEBHOOK_URL }}
      FLOUS_WEBHOOK_SECRET: ${{ secrets.FLOUS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flous-data-dist
          path: dist/

      - name: Upload data to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp dist/flous-data.json s3://flous-data/v1/dump.json \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300, must-revalidate"
          aws s3 cp dist/flous.sqlite s3://flous-data/v1/flous.sqlite \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Trigger flous-api data refresh
        if: ${{ env.FLOUS_WEBHOOK_URL != '' }}
        run: |
          PAYLOAD='{"event":"data_updated","version":"${{ needs.build.outputs.version }}"}'
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$FLOUS_WEBHOOK_SECRET" | sed 's/.* //')
          curl -f -X POST "$FLOUS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$SIG" \
            -d "$PAYLOAD"
