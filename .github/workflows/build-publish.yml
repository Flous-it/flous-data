name: Build & Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  validate:
    uses: ./.github/workflows/pr-validate.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build artifacts
        run: python scripts/build.py

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flous-data-dist
          path: dist/
          retention-days: 7

  publish-cdn:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flous-data-dist
          path: dist/

      - name: Upload JSON to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp dist/flous-data.json s3://flous-data/v1/dump.json \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Trigger flous-api data refresh
        env:
          FLOUS_WEBHOOK_URL: ${{ secrets.FLOUS_WEBHOOK_URL }}
          FLOUS_WEBHOOK_SECRET: ${{ secrets.FLOUS_WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"event":"data_updated","version":"${{ needs.build.outputs.version }}"}'
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$FLOUS_WEBHOOK_SECRET" | sed 's/.* //')
          curl -f -X POST "$FLOUS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$SIG" \
            -d "$PAYLOAD"

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - uses: actions/download-artifact@v4
        with:
          name: flous-data-dist
          path: dist/

      - name: Copy SQLite into package for bundling
        run: cp dist/flous.sqlite packages/flous_data/

      - name: Build wheel
        run: python -m build --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: flous-data-dist
          path: dist/

      - name: Install JS deps + build
        working-directory: packages/flous-data-js
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        working-directory: packages/flous-data-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
